<!DOCTYPE html>
<html>

<head>

    <title>WebSocket Chat Test 2</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

</head>

<body>

<h2>Spring Boot WebSocket Test</h2>

<input type="text" id="message">

<button onclick="sendMessage()">
    Send
</button>

<ul id="messages"></ul>

<script>

    let stompClient = null;

    function connect() {

        const socket =
            new SockJS(
                'http://localhost:8083/escproject/api/chat'
            );

        stompClient = Stomp.over(socket);

        stompClient.connect(

            {
                //on simule temporairement le user d'id 1. car y'a pas de JWT pour le moment.
                login: "1"
            },

            function () {

                console.log('Connected');

                stompClient.subscribe(
                    //fonctionne avec JWT
                    //'/topic/messages/1',

                    //focntionne sans jwt.
                    //provisoire.
                    '/topic/messages/1',
                    function (message) {

                        showMessage(
                            JSON.parse(message.body)
                        );
                    }
                );
            });
    }

    function sendMessage() {

        const content =
            document.getElementById('message').value;

        stompClient.send(
            "/app/sendMessage",
            {},

            JSON.stringify({

                sender: "Ahmed",

                receiver: "Sara",

                content: content
            })
        );
    }

    function showMessage(message) {
        /// old version that doesnt supprot the file test.html.
        // const li = document.createElement('li');
        //
        // li.appendChild(
        //
        //     document.createTextNode(
        //         message.sender.firstName + " : " + message.content
        //     )
        // );
        //
        // document.getElementById('messages')
        //     .appendChild(li);

        /// new versioin that supports swagger and test.html.
        const li = document.createElement('li');

        let senderName;

        if (typeof message.sender === 'object') {

            senderName = message.sender.firstName;

        } else {

            senderName = message.sender;
        }

        li.appendChild(

            document.createTextNode(
                senderName +
                " : " +
                message.content
            )
        );

        document.getElementById('messages')
            .appendChild(li);
    }

    connect();

</script>

</body>
</html>
