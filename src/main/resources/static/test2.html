<!DOCTYPE html>
<html>

<head>

    <title>WebSocket Chat Test 2</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

</head>

<body>

<h2>Spring Boot WebSocket Test - User 2</h2>

<input type="text" id="message" placeholder="Type a message">

<button onclick="sendMessage()">
    Send
</button>

<h3>Messages</h3>

<ul id="messages"></ul>

<h3>Notifications</h3>

<ul id="notifications"></ul>

<script>

    let stompClient = null;

    function connect() {

        const socket =
            new SockJS(
                'http://localhost:8083/escproject/api/chat'
            );

        stompClient = Stomp.over(socket);

        stompClient.connect(

            {
                // Simulation temporaire user id = 2
                // En attendant JWT/Spring Security
                login: "2"
            },

            function () {

                console.log('Connected');

                // =========================
                // Private Messages
                // =========================

                stompClient.subscribe(

                    // Version temporaire sans JWT
                    '/topic/messages/2',

                    function (message) {

                        showMessage(
                            JSON.parse(message.body)
                        );
                    }
                );

                // =========================
                // Notifications
                // =========================

                stompClient.subscribe(

                    '/topic/notifications/2',

                    function (notification) {

                        showNotification(
                            JSON.parse(notification.body)
                        );
                    }
                );
            });
    }

    // ====================================
    // Send message directly through WS
    // ====================================

    function sendMessage() {

        const content =
            document.getElementById('message').value;

        stompClient.send(

            "/app/sendMessage",

            {},

            JSON.stringify({

                sender: "Ahmed",

                receiver: "Sara",

                content: content
            })
        );
    }

    // ====================================
    // Display Messages
    // ====================================

    function showMessage(message) {

        const li = document.createElement('li');

        let senderName;

        // Support Swagger DTO/JPA object
        if (typeof message.sender === 'object') {

            senderName = message.sender.firstName;

        }

        // Support direct HTML sender String
        else {

            senderName = message.sender;
        }

        li.appendChild(

            document.createTextNode(

                senderName +
                " : " +
                message.content
            )
        );

        document.getElementById('messages')
            .appendChild(li);
    }

    // ====================================
    // Display Notifications
    // ====================================

    function showNotification(notification) {

        const li = document.createElement('li');

        li.appendChild(

            document.createTextNode(

                "🔔 " +
                notification.senderName +
                " : " +
                notification.content
            )
        );

        document.getElementById('notifications')
            .appendChild(li);
    }

    // ====================================
    // Start Connection
    // ====================================

    connect();

</script>

</body>
</html>
