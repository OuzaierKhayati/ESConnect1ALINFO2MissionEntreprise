spring.application.name=ESCProject
spring.datasource.url=jdbc:mysql://localhost:3306/esconnectDB?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
#Melek datasource password root

server.port=8083

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.servlet.context-path=/escproject/api

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
jwt.secret=mySecretKeyForJWTAuthenticationIsVeryLongAndSecureEnoughForHS256Algorithm1234567890
jwt.expiration=86400000
