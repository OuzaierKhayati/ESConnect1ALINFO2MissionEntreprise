spring.application.name=ESCProject
spring.datasource.url=jdbc:mysql://localhost:3306/esconnectDB?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

server.port=8083

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.servlet.context-path=/escproject/api

# JWT Configuration
jwt.secret=mySecretKeyForJWTAuthenticationIsVeryLongAndSecureEnoughForHS256Algorithm1234567890
jwt.expiration=86400000

# File Upload Configuration
file.upload.dir=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#http://localhost:8083/escproject/api/swagger-ui.html